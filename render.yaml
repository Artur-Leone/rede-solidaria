services:
  - type: web
    name: bairro-que-cuida-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /api/summary
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bairro-que-cuida-db
          property: connectionString

databases:
  - name: bairro-que-cuida-db
    databaseName: bairro_que_cuida
    user: bairro_que_cuida
    plan: free
